<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - KAVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body">

<!-- ================================================================= -->
<!-- CONTENEDOR DE TOASTS (Flotante, fuera de la tarjeta de login)     -->
<!-- ================================================================= -->
<div class="toast-container">

    <!-- 1. Toast de ERROR (Se muestra si la URL tiene ?error) -->
    <div th:if="${param.error}" class="toast error">
        <div class="toast-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 8v4M12 16h.01"/>
            </svg>
        </div>
        <div class="toast-content">
            <div class="toast-title">Error de acceso</div>
            <div class="toast-message">Usuario o contraseña incorrectos.</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
        </button>
        <div class="toast-progress"></div>
    </div>

    <!-- 2. Toast de LOGOUT (Se muestra si la URL tiene ?logout) -->
    <div th:if="${param.logout}" class="toast success">
        <div class="toast-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12.5 4.5 4.5L19 7"/>
            </svg>
        </div>
        <div class="toast-content">
            <div class="toast-title">Sesión cerrada</div>
            <div class="toast-message">Has salido del sistema correctamente.</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
        </button>
        <div class="toast-progress"></div>
    </div>

</div>

<!-- ================================================================= -->
<!-- TARJETA DE LOGIN                                                  -->
<!-- ================================================================= -->
<div class="login-card">
    <div class="login-header">
        <div class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="15.5" r="2.1" fill="#fff" stroke="none"/>
                <path d="M8.6 12.1a4.8 4.8 0 0 1 6.8 0"/><path d="M5.9 9.3a8.6 8.6 0 0 1 12.2 0"/>
            </svg>
        </div>
        <h2>KAVA</h2>
        <p>ERP SUITE</p>
    </div>

    <form th:action="@{/login}" method="post" onsubmit="document.getElementById('submitBtn').disabled = true; document.getElementById('submitBtn').innerHTML = '<span>Verificando...</span>';">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
            <span>Ingresar al sistema</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
    </form>
</div>

<!-- Script global de UX (Toasts, Menú, etc.) -->
<script th:src="@{/js/ux.js}"></script>
</body>
</html>
