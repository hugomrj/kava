<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Definimos el fragmento con el nombre "main-menu" -->
<nav class="topnav" th:fragment="main-menu">
    <div class="brand">
        <div class="mark-sm">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="15.5" r="2.1" fill="#fff" stroke="none"/>
                <path d="M8.6 12.1a4.8 4.8 0 0 1 6.8 0"/><path d="M5.9 9.3a8.6 8.6 0 0 1 12.2 0"/>
            </svg>
        </div>
        <div class="bname"><strong>KAVA</strong><span>ERP SUITE</span></div>
    </div>

    <button class="mobile-toggle" id="mobileMenuBtn" aria-label="Abrir menú">

    <ul class="hnav" id="mainNav">

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
            </button>
        </li>

        <!-- ═══════ PANEL GENERAL ═══════ -->
        <li><button class="nav-item active" data-key="dash">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                <rect x="3" y="3" width="7.5" height="9.5" rx="1.6"/>
                <rect x="13.5" y="3" width="7.5" height="5.5" rx="1.6"/>
                <rect x="13.5" y="11.5" width="7.5" height="9.5" rx="1.6"/>
                <rect x="3" y="15.5" width="7.5" height="5.5" rx="1.6"/>
            </svg>
            Panel general
        </button></li>

        <!-- ═══════ VENTAS ═══════ -->
        <li class="has-sub">
            <button class="nav-item" data-key="ventas">

                Ventas <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="submenu">
                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span class="mlbl">Nueva venta</span></button>
                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span class="mlbl">Lista de ventas</span></button>
                <span class="msep"></span>
                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M16 5.4a3.2 3.2 0 0 1 0 5.2M17.5 15.4c1.7.7 2.7 2.3 3 4.6"/></svg><span class="mlbl">Clientes</span></button>

                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3h8L19 7.5V21H6.5z"/><path d="M14 3v5h5"/><path d="M9.5 14h5M9.5 17h3"/></svg><span class="mlbl">Pagarés</span></button>

                Compras <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="submenu">
                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span class="mlbl">Nueva compra</span></button>
                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span class="mlbl">Lista de compras</span></button>
                <span class="msep"></span>
                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 16.5V6.5H14v10"/><path d="M14 9.5h4.2L21 12.6v3.9H14"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg><span class="mlbl">Proveedores</span></button>

        </li>

        <!-- ═══════ INVENTARIO ═══════ -->
        <li class="has-sub">
            <button class="nav-item" data-key="inv">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3.5 7.4v9.2L12 21l8.5-4.4V7.4L12 3Z"/><path d="M3.5 7.4 12 11.8l8.5-4.4"/><path d="M12 11.8V21"/></svg>
                Inventario <em class="mini-badge warn">3</em> <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="submenu">
                <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="M12 12.8V21"/><path d="m3.3 7.8 8.7 5 8.7-5"/></svg><span class="mlbl">Productos</span></button>

                <span class="msep"></span>
                <div class="has-fly">
                    <button class="mobile-sub-toggle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2.4 2.6H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                        <span class="mlbl">Maestros</span>
                        <svg class="farr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                    </button>
                    <div class="fly">
                        <button><span class="mlbl">Categorías</span></button>
                        <button><span class="mlbl">Marcas</span></button>
                        <button><span class="mlbl">Unidades de medida</span></button>
                        <button><span class="mlbl">Tipos de impuestos</span></button>
                    </div>
                </div>
            </div>
        </li>

        <!-- ═══════ CAJA ═══════ -->
        <li class="has-sub">
            <button class="nav-item" data-key="caja">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M20 7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M17 13.5h.01"/></svg>

                <button><span class="mlbl">Abrir / cerrar caja</span></button>
                <button><span class="mlbl">Aperturas y cierres</span></button>

                <button><span class="mlbl">Movimientos de caja</span></button>
                <button><span class="mlbl">Gastos</span></button>

                <span class="msep"></span>
                <button><span class="mlbl">Consumos del personal</span></button>
            </div>

            <button class="nav-item" data-key="rep">

                <button><span class="mlbl">Compras</span></button>

            </div>
        </li>

        <!-- ═══════ ADMINISTRACIÓN ═══════ -->
        <li class="has-sub">
            <button class="nav-item" data-key="admin">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.8 7.8 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.8 7.8 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5a7.8 7.8 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6a7.8 7.8 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.8 7.8 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.8 7.8 0 0 0 2.6-1.5l2.4 1 2-3.4Z"/></svg>

            </button>
            <div class="submenu">
                <button><span class="mlbl">Usuarios</span></button>
                <button><span class="mlbl">Niveles de usuario</span></button>
                <button><span class="mlbl">Funcionarios</span></button>
                <button><span class="mlbl">Sucursales</span></button>
                <button><span class="mlbl">Cajas</span></button>

        <button class="icon-btn" id="bellBtn" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5a6 6 0 0 1 12 0c0 4.8 1.8 5.9 1.8 5.9H4.2S6 14.3 6 9.5"/><path d="M10 19.4a2.3 2.3 0 0 0 4 0"/></svg>
            <span class="bdg">4</span>
        </button>
        <div class="user">
            <div class="ava">LM</div>
            <div class="uname"><strong>Laura Méndez</strong><span>Administradora</span></div>
        </div>
        <button hx-post="/auth/logout" hx-target="body" class="btn btn-ghost" style="margin-left: 10px; padding: 8px 12px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
