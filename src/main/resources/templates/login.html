<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - KAVA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-header">
        <div class="mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="15.5" r="2.1" fill="#fff" stroke="none"/>
                <path d="M8.6 12.1a4.8 4.8 0 0 1 6.8 0"/><path d="M5.9 9.3a8.6 8.6 0 0 1 12.2 0"/>
            </svg>
        </div>
        <h2>KAVA</h2>
        <p>ERP SUITE</p>
    </div>

    <div id="error-container"></div>

    <form hx-post="/auth/login" hx-target="#error-container" hx-swap="innerHTML">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">
            <span>Ingresar al sistema</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
    </form>
</div>
</body>
</html>
